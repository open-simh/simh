::
:: Register-level KWV11-A/C tests.  Each case executes real PDP-11 MOV
:: instructions so that the simulator's I/O dispatch and device callbacks
:: are exercised.  Maintenance pulses provide deterministic ST1/ST2 input.

set kwv11 enabled
reset
dep 100 1100
dep 102 0
dep 1100 2

:: The manual describes BPR as word-oriented: a byte write produces a whole
:: word write (EK-ADV11-OP-002, printed p. 3-9 / PDF p. 38).  DEC's CVKWAC0
:: and CNKWAA0 diagnostics use word MOV for BPR tests (CVKWAC0 pp. 2-3;
:: CNKWAA0 pp. 58-59) and reserve MOVB tests for CSR byte-lane behavior
:: (CVKWAC0 p. 5; CNKWAA0 pp. 60-61).
echof "** KWV11: word-oriented BPR byte writes"
dep 0 112737
dep 2 123
dep 4 170422
dep 6 112737
dep 10 45
dep 12 170423
dep 14 0
dep pc 0
go
ASSERT KWV11 BPR=22400

echof "** KWV11: preset and one-shot overflow"
dep 0 12737
dep 2 177777
dep 4 170422
dep 6 12737
dep 10 61
dep 12 170420
dep 14 12737
dep 16 461
dep 20 170420
dep 22 0
dep pc 0
go
ASSERT KWV11 BPR=177777
ASSERT KWV11 CSR=260

echof "** KWV11: repeated overflow reload"
reset
dep 0 12737
dep 2 177777
dep 4 170422
dep 6 12737
dep 10 63
dep 12 170420
dep 14 12737
dep 16 463
dep 20 170420
dep 22 0
dep pc 0
go
ASSERT KWV11 BPR=177777
ASSERT KWV11 CSR=263

echof "** KWV11: ST2 capture in external-event mode"
reset
dep 0 12737
dep 2 65
dep 4 170420
dep 6 12737
dep 10 465
dep 12 170420
dep 14 12737
dep 16 1065
dep 20 170420
dep 22 0
dep pc 0
go
ASSERT KWV11 BPR=1
ASSERT KWV11 CSR=100065

echof "** KWV11: external-event-from-zero mode"
reset
dep 0 12737
dep 2 67
dep 4 170420
dep 6 12737
dep 10 467
dep 12 170420
dep 14 12737
dep 16 1067
dep 20 170420
dep 22 12737
dep 24 467
dep 26 170420
dep 30 12737
dep 32 1067
dep 34 170420
dep 36 0
dep pc 0
go
ASSERT KWV11 BPR=1
ASSERT KWV11 CSR=110067

echof "** KWV11: autonomous oscillator"
reset
dep sp 10000
dep 440 1000
dep 442 0
dep 0 12737
dep 2 177777
dep 4 170422
dep 6 12737
dep 10 113
dep 12 170420
dep 14 1
dep 16 1
dep 1000 0
dep pc 0
go
ASSERT PC=1002
ASSERT KWV11 BPR=177777
ASSERT KWV11 CSR=313

echof "** KWV11: overflow interrupt vector"
reset
dep sp 10000
dep 440 1000
dep 442 0
dep 0 12737
dep 2 177777
dep 4 170422
dep 6 12737
dep 10 161
dep 12 170420
dep 14 12737
dep 16 561
dep 20 170420
dep 22 0
dep 1000 0
dep pc 0
go
ASSERT PC=1002

echof "** KWV11: ST2 interrupt vector"
reset
dep sp 10000
dep 444 1000
dep 446 0
dep 0 12737
dep 2 65
dep 4 170420
dep 6 12737
dep 10 40065
dep 12 170420
dep 14 12737
dep 16 41065
dep 20 170420
dep 22 0
dep 1000 0
dep pc 0
go
ASSERT PC=1002

echof "** KWV11: vector and line-frequency configuration"
ASSERT KWV11 TPS[1]=1000000
ASSERT KWV11 TPS[2]=100000
ASSERT KWV11 TPS[3]=10000
ASSERT KWV11 TPS[4]=1000
ASSERT KWV11 TPS[5]=100
ASSERT KWV11 TPS[7]=50
set kwv11 60hz
ASSERT KWV11 DEVVEC=440
ASSERT KWV11 TPS[7]=60

echof "** KWV11: autonomous 60 Hz line clock"
reset
dep sp 10000
dep 440 1000
dep 442 0
dep 0 12737
dep 2 177777
dep 4 170422
dep 6 12737
dep 10 173
dep 12 170420
dep 14 1
dep 16 1
dep 1000 0
dep pc 0
go
ASSERT PC=1002
ASSERT KWV11 BPR=177777

echof "!! All KWV11 Tests Passed !!"
exit 0
